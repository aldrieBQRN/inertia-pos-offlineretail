name: 🚀 Deploy to InfinityFree

on:
  push:
    branches: [demo]
  workflow_dispatch:

concurrency:
  group: deploy-infinityfree
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: ⚡ Build Assets & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout demo branch
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend assets (Vite)
        run: npm run build
        env:
          NODE_ENV: production

      - name: Create production .env
        env:
          APP_KEY:        ${{ secrets.APP_KEY }}
          APP_URL:        ${{ secrets.APP_URL }}
          DB_HOST:        ${{ secrets.DB_HOST }}
          DB_DATABASE:    ${{ secrets.DB_DATABASE }}
          DB_USERNAME:    ${{ secrets.DB_USERNAME }}
          DB_PASSWORD:    ${{ secrets.DB_PASSWORD }}
          MIGRATE_TOKEN:  ${{ secrets.MIGRATE_TOKEN }}
        run: |
          cat > .env << EOF
          APP_NAME="Inertia POS Demo"
          APP_ENV=production
          APP_KEY=${APP_KEY}
          APP_DEBUG=true
          APP_URL=${APP_URL}
          APP_DEMO_MODE=true

          APP_LOCALE=en
          APP_FALLBACK_LOCALE=en
          APP_MAINTENANCE_DRIVER=file
          BCRYPT_ROUNDS=10

          LOG_CHANNEL=single
          LOG_LEVEL=debug

          DB_CONNECTION=mysql
          DB_HOST=${DB_HOST}
          DB_PORT=3306
          DB_DATABASE=${DB_DATABASE}
          DB_USERNAME=${DB_USERNAME}
          DB_PASSWORD=${DB_PASSWORD}

          SESSION_DRIVER=file
          SESSION_LIFETIME=120
          SESSION_ENCRYPT=false
          SESSION_PATH=/
          SESSION_DOMAIN=null

          BROADCAST_CONNECTION=log
          FILESYSTEM_DISK=local
          QUEUE_CONNECTION=sync
          CACHE_STORE=file
          AUDIT_QUEUE_ENABLED=false
          MAIL_MAILER=log

          VITE_APP_NAME="Inertia POS Demo"
          MIGRATE_TOKEN=${MIGRATE_TOKEN}
          EOF

      - name: Deploy app code via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server:      ${{ secrets.FTP_HOST }}
          username:    ${{ secrets.FTP_USERNAME }}
          password:    ${{ secrets.FTP_PASSWORD }}
          local-dir:   ./
          server-dir:  /htdocs/
          protocol:    ftp
          port:        21
          timeout:     60000
          exclude: |
            **/.git*
            **/.git*/**
            **/vendor/**
            **/node_modules/**
            **/tests/**
            **/e2e/**
            **/playwright*
            **/.agents/**
            **/phpunit.xml
            **/.env.mysql-backup
            **/.env.example
            **/.env.infinityfree.example
            **/env.txt
            **/app.env
            **/storage/logs/**
            **/storage/framework/cache/**
            **/storage/framework/sessions/**
            **/storage/framework/views/**
            **/storage/pail/**
            **/*.bat
            **/*.exe
            **/*.pdf
            **/packaging/**
            **/documentation/**
            **/zip_vendor.php
            **/php_errors.log
            **/jsconfig.json

      - name: ✅ Deployment summary
        run: |
          echo "✅ Deployed successfully to InfinityFree!"
